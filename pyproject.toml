[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-worker"
version = "0.1.0"
description = "Minimal Dockerized worker for inspecting a Git repository"
requires-python = ">=3.11"
dependencies = ["Markdown>=3.8,<4", "openai>=2.48,<3", "openai-codex==0.144.4", "Pillow>=11,<13", "python-telegram-bot>=21,<22"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
codex-safe-launcher = "codex_runtime:main"
api-football = "api_football_cli:main"
api-football-mcp = "api_football_mcp:main"
git-publish-mcp = "git_publish_mcp:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent", "api_football", "api_football_cli", "api_football_mcp", "git_publish", "git_publish_mcp", "codex_backend", "codex_login", "codex_runtime", "router", "owner_trace", "usage", "worker", "telegram_bot", "deployment", "deployer", "self_deployment"]
