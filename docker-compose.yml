services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WORKER_IMAGE:-repository-worker:latest}
    entrypoint: ["/bin/true"]

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: ${BOT_IMAGE:-personal-agent-bot:latest}
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?TELEGRAM_ALLOWED_USER_ID is required}
      WORKER_IMAGE: repository-worker:latest
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      AGENT_WORKSPACE_ROOT: /workspace/personal-agent
      SELF_REPOSITORY_PATH: /workspace/personal-agent
      DEPLOY_COMPOSE_FILE: /workspace/personal-agent/docker-compose.yml
      DEPLOY_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-personal-agent}
      BOT_IMAGE: ${BOT_IMAGE:-personal-agent-bot:latest}
      DEPLOYMENT_STATE_DIR: /workspace/.personal-agent-state
      HOST_WORKSPACE_DIR: ${HOST_WORKSPACE_DIR:-./workspace}
      GIT_SSH_COMMAND: >-
        ssh -i /run/secrets/github_key
        -o IdentitiesOnly=yes
        -o UserKnownHostsFile=/run/secrets/github_known_hosts
        -o StrictHostKeyChecking=yes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_WORKSPACE_DIR:-./workspace}:/workspace
      - ${GIT_SSH_KEY_PATH:-./secrets/personal-agent-github}:/run/secrets/github_key:ro
      - ${GIT_KNOWN_HOSTS_PATH:-./secrets/known_hosts}:/run/secrets/github_known_hosts:ro
    depends_on:
      - worker
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import os; assert Path('/tmp/personal-agent-ready').exists(); os.kill(1, 0)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  deployer:
    build:
      context: .
      dockerfile: Dockerfile.deployer
    image: ${DEPLOYER_IMAGE:-personal-agent-deployer:latest}
    entrypoint: ["python", "-m", "deployer"]
    environment:
      DEPLOY_COMPOSE_FILE: /workspace/personal-agent/docker-compose.yml
      DEPLOY_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-personal-agent}
      BOT_IMAGE: ${BOT_IMAGE:-personal-agent-bot:latest}
      DEPLOYMENT_STATE_DIR: /workspace/.personal-agent-state
      SELF_REPOSITORY_PATH: /workspace/personal-agent
      HOST_WORKSPACE_DIR: ${HOST_WORKSPACE_DIR:-./workspace}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?TELEGRAM_ALLOWED_USER_ID is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      WORKER_IMAGE: ${WORKER_IMAGE:-repository-worker:latest}
      GIT_SSH_KEY_PATH: ${GIT_SSH_KEY_PATH:-./secrets/personal-agent-github}
      GIT_KNOWN_HOSTS_PATH: ${GIT_KNOWN_HOSTS_PATH:-./secrets/known_hosts}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_WORKSPACE_DIR:-./workspace}:/workspace
    restart: unless-stopped
