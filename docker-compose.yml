services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WORKER_IMAGE:-repository-worker:latest}
    entrypoint: ["/bin/true"]

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: ${BOT_IMAGE:-personal-agent-bot:latest}
    environment:
      AGENT_BACKEND: ${AGENT_BACKEND:-codex}
      CODEX_HOME: /codex-home
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?TELEGRAM_ALLOWED_USER_ID is required}
      TELEGRAM_MAX_IMAGE_BYTES: ${TELEGRAM_MAX_IMAGE_BYTES:-10485760}
      TELEGRAM_MAX_AUDIO_BYTES: ${TELEGRAM_MAX_AUDIO_BYTES:-20000000}
      TELEGRAM_MAX_AUDIO_SECONDS: ${TELEGRAM_MAX_AUDIO_SECONDS:-600}
      WORKER_IMAGE: repository-worker:latest
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_ROUTER_ENABLED: ${OPENAI_ROUTER_ENABLED:-1}
      OPENAI_ROUTER_MODEL: ${OPENAI_ROUTER_MODEL:-gpt-5-nano}
      OPENAI_ECONOMY_MODEL: ${OPENAI_ECONOMY_MODEL:-gpt-5.6-luna}
      OPENAI_INTERMEDIATE_MODEL: ${OPENAI_INTERMEDIATE_MODEL:-gpt-5.6-terra}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_ECONOMY_REASONING_EFFORT: ${OPENAI_ECONOMY_REASONING_EFFORT:-low}
      OPENAI_INTERMEDIATE_REASONING_EFFORT: ${OPENAI_INTERMEDIATE_REASONING_EFFORT:-low}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_TEXT_VERBOSITY: ${OPENAI_TEXT_VERBOSITY:-low}
      OPENAI_ECONOMY_MAX_OUTPUT_TOKENS: ${OPENAI_ECONOMY_MAX_OUTPUT_TOKENS:-4096}
      OPENAI_INTERMEDIATE_MAX_OUTPUT_TOKENS: ${OPENAI_INTERMEDIATE_MAX_OUTPUT_TOKENS:-12288}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16384}
      OPENAI_COMPACT_THRESHOLD: ${OPENAI_COMPACT_THRESHOLD:-32000}
      OPENAI_TURN_WARNING_TOKENS: ${OPENAI_TURN_WARNING_TOKENS:-100000}
      USAGE_DB_PATH: ${USAGE_DB_PATH:-/workspace/.personal-agent-state/usage.sqlite3}
      TRACE_DB_PATH: ${TRACE_DB_PATH:-/trace-state/traces.sqlite3}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-7}
      TRACE_EXPORT_PART_BYTES: ${TRACE_EXPORT_PART_BYTES:-47185920}
      AGENT_WORKSPACE_ROOT: /workspace
      SELF_REPOSITORY_PATH: /workspace/personal-agent
      DEPLOY_COMPOSE_FILE: /workspace/personal-agent/docker-compose.yml
      DEPLOY_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-personal-agent}
      BOT_IMAGE: ${BOT_IMAGE:-personal-agent-bot:latest}
      DEPLOYMENT_STATE_DIR: /workspace/.personal-agent-state
      HOST_WORKSPACE_DIR: ${HOST_WORKSPACE_DIR:-./workspace}
    volumes:
      - ${HOST_WORKSPACE_DIR:-./workspace}:/workspace
      - codex-state:/codex-home
      - trace-state:/trace-state
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import os; assert Path('/tmp/personal-agent-ready').exists(); os.kill(1, 0)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  deployer:
    build:
      context: .
      dockerfile: Dockerfile.deployer
    image: ${DEPLOYER_IMAGE:-personal-agent-deployer:latest}
    entrypoint: ["python", "-m", "deployer"]
    environment:
      DEPLOY_COMPOSE_FILE: /workspace/personal-agent/docker-compose.yml
      DEPLOY_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-personal-agent}
      BOT_IMAGE: ${BOT_IMAGE:-personal-agent-bot:latest}
      DEPLOYMENT_STATE_DIR: /workspace/.personal-agent-state
      SELF_REPOSITORY_PATH: /workspace/personal-agent
      HOST_WORKSPACE_DIR: ${HOST_WORKSPACE_DIR:-./workspace}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?TELEGRAM_ALLOWED_USER_ID is required}
      WORKER_IMAGE: ${WORKER_IMAGE:-repository-worker:latest}
      TRACE_DB_PATH: ${TRACE_DB_PATH:-/trace-state/traces.sqlite3}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-7}
      GIT_SSH_KEY_PATH: ${GIT_SSH_KEY_PATH:-./secrets/personal-agent-github}
      GIT_KNOWN_HOSTS_PATH: ${GIT_KNOWN_HOSTS_PATH:-./secrets/known_hosts}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_WORKSPACE_DIR:-./workspace}:/workspace
      - trace-state:/trace-state
    restart: unless-stopped

  codex-login:
    profiles: ["management"]
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: ${BOT_IMAGE:-personal-agent-bot:latest}
    entrypoint: ["python", "-m", "codex_login"]
    environment:
      CODEX_HOME: /codex-home
    volumes:
      - codex-state:/codex-home

volumes:
  codex-state:
  trace-state:
