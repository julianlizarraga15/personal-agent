<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Agent — Architecture Map</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #0e131b;
      --panel-2: #121923;
      --line: #263141;
      --text: #edf3f8;
      --muted: #8793a3;
      --green: #78f0b0;
      --cyan: #67d7f7;
      --amber: #ffc86b;
      --pink: #f58db1;
      --purple: #b4a2ff;
      --red: #ff737e;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; background: var(--bg); }

    body {
      min-width: 760px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-feature-settings: "tnum" 1, "ss01" 1;
    }

    button { font: inherit; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 14px;
      overflow: hidden;
    }

    .bar {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(14, 19, 27, .92);
      box-shadow: 0 12px 40px rgba(0,0,0,.24);
    }

    .brand {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 8px;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      white-space: nowrap;
    }

    .brand-mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--bg);
      color: var(--green);
      font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong { font-size: 12px; letter-spacing: .08em; }
    .brand-copy small { font-size: 8px; color: #53606e; letter-spacing: .14em; }

    .tabs {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .tab, .layer {
      height: 40px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 15px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: 150ms ease;
    }

    .tab:hover, .layer:hover { color: var(--text); background: #151d28; }
    .tab[aria-selected="true"] { color: var(--text); background: #192330; border-color: #2a3849; }

    .snapshot {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      border: 1px solid #263442;
      border-radius: 10px;
      background: #101821;
      color: var(--muted);
      font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(120,240,176,.09), 0 0 18px rgba(120,240,176,.35);
    }

    .viewport {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        radial-gradient(circle at 50% 15%, rgba(103,215,247,.055), transparent 32%),
        var(--panel);
      background-size: 28px 28px, 28px 28px, auto, auto;
    }

    .view {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    .view.active { display: flex; }

    .map {
      display: block;
      width: 100%;
      min-width: 0;
      height: 100%;
      max-height: none;
    }

    svg text { user-select: none; }
    .zone { fill: rgba(8,11,16,.44); stroke: #263141; stroke-width: 1.25; }
    .zone-dash { stroke-dasharray: 8 7; }
    .zone-title-bg { fill: #182230; stroke: #2a394a; }
    .zone-title { fill: #aab5c3; font-size: 11px; font-weight: 800; letter-spacing: .13em; }

    .node { cursor: help; outline: none; }
    .node .body { fill: #151d28; stroke: #2a3747; stroke-width: 1.4; transition: 150ms ease; }
    .node:hover .body, .node:focus .body { fill: #1a2532; stroke: #526579; }
    .node .icon-bg { fill: #0d131b; }
    .node .icon { fill: var(--text); font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
    .node .title { fill: var(--text); font-size: 16px; font-weight: 760; }
    .node .meta { fill: var(--muted); font-size: 10.5px; font-weight: 560; }
    .node .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .node .status { font-size: 9px; font-weight: 850; letter-spacing: .1em; }
    .node .tiny { fill: var(--muted); font-size: 9px; }

    .green .body { stroke: rgba(120,240,176,.43); }
    .green .icon-bg { fill: rgba(120,240,176,.13); }
    .green .icon, .green .status { fill: var(--green); }
    .cyan .body { stroke: rgba(103,215,247,.43); }
    .cyan .icon-bg { fill: rgba(103,215,247,.13); }
    .cyan .icon, .cyan .status { fill: var(--cyan); }
    .amber .body { stroke: rgba(255,200,107,.42); }
    .amber .icon-bg { fill: rgba(255,200,107,.13); }
    .amber .icon, .amber .status { fill: var(--amber); }
    .pink .body { stroke: rgba(245,141,177,.42); }
    .pink .icon-bg { fill: rgba(245,141,177,.13); }
    .pink .icon, .pink .status { fill: var(--pink); }
    .purple .body { stroke: rgba(180,162,255,.43); }
    .purple .icon-bg { fill: rgba(180,162,255,.13); }
    .purple .icon, .purple .status { fill: var(--purple); }
    .red .body { stroke: rgba(255,115,126,.43); }
    .red .icon-bg { fill: rgba(255,115,126,.13); }
    .red .icon, .red .status { fill: var(--red); }
    .idle { opacity: .62; }

    .edge { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .edge.call { stroke: var(--cyan); marker-end: url(#arrow-cyan); }
    .edge.write { stroke: var(--pink); stroke-dasharray: 5 5; marker-end: url(#arrow-pink); }
    .edge.mount { stroke: var(--amber); stroke-dasharray: 2 6; marker-end: url(#arrow-amber); }
    .edge.publish { stroke: var(--purple); marker-end: url(#arrow-purple); }
    .edge.control { stroke: var(--green); marker-end: url(#arrow-green); }
    .edge.rollback { stroke: var(--red); stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
    .edge.dim { stroke: #405064; marker-end: url(#arrow-dim); }
    .edge.bi { marker-start: url(#dot-cyan); }
    .edge-label rect { fill: #0c1219; stroke: #283646; }
    .edge-label text { fill: #9ba8b8; font-size: 9px; font-weight: 750; letter-spacing: .05em; text-anchor: middle; }

    body.hide-call .edge.call, body.hide-call .label-call { opacity: .06; }
    body.hide-write .edge.write, body.hide-write .label-write { opacity: .06; }
    body.hide-mount .edge.mount, body.hide-mount .label-mount { opacity: .06; }
    body.hide-control .edge.control, body.hide-control .edge.publish, body.hide-control .label-control { opacity: .06; }

    .footer { justify-content: space-between; min-height: 50px; }
    .layers { display: flex; gap: 5px; }
    .layer { height: 32px; padding: 0 11px; border-color: #243142; }
    .layer::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: currentColor; }
    .layer[data-layer="call"] { color: var(--cyan); }
    .layer[data-layer="write"] { color: var(--pink); }
    .layer[data-layer="mount"] { color: var(--amber); }
    .layer[data-layer="control"] { color: var(--green); }
    .layer.off { color: #455160; opacity: .72; }

    .hint {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid #243142;
      border-radius: 10px;
      color: #687689;
      font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
    }

    .hint kbd {
      min-width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      padding: 0 4px;
      border: 1px solid #3a4756;
      border-bottom-width: 2px;
      border-radius: 5px;
      color: #a2adba;
      background: #121923;
      font: inherit;
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      width: min(310px, calc(100vw - 28px));
      padding: 12px;
      border: 1px solid #3a4a5d;
      border-radius: 12px;
      background: rgba(12,17,24,.97);
      box-shadow: 0 18px 60px rgba(0,0,0,.52);
      pointer-events: none;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 100ms ease, transform 100ms ease;
    }

    .tooltip.show { opacity: 1; transform: translateY(0); }
    .tooltip strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 12px; }
    .tooltip span { display: block; color: #98a5b5; font-size: 11px; line-height: 1.5; }

    @media (max-width: 900px) {
      .brand-copy small, .snapshot span { display: none; }
      .tab { padding: 0 10px; }
      .footer .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

  <aside class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"><strong></strong><span></span></aside>

  <script>
    (() => {
      const tabs = [...document.querySelectorAll('.tab')];
      const views = [...document.querySelectorAll('.view')];
      const layers = [...document.querySelectorAll('.layer')];
      const tip = document.getElementById('tooltip');
      const tipTitle = tip.querySelector('strong');
      const tipBody = tip.querySelector('span');

      function showView(id) {
        tabs.forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.view === id)));
        views.forEach(view => view.classList.toggle('active', view.id === id));
      }

      tabs.forEach(tab => tab.addEventListener('click', () => showView(tab.dataset.view)));

      layers.forEach(button => button.addEventListener('click', () => {
        const isOn = button.getAttribute('aria-pressed') === 'true';
        button.setAttribute('aria-pressed', String(!isOn));
        button.classList.toggle('off', isOn);
        document.body.classList.toggle(`hide-${button.dataset.layer}`, isOn);
      }));

      function placeTip(event) {
        const pad = 14;
        const box = tip.getBoundingClientRect();
        let x = event.clientX + 16;
        let y = event.clientY + 16;
        if (x + box.width > window.innerWidth - pad) x = event.clientX - box.width - 16;
        if (y + box.height > window.innerHeight - pad) y = event.clientY - box.height - 16;
        tip.style.left = `${Math.max(pad, x)}px`;
        tip.style.top = `${Math.max(pad, y)}px`;
      }

      document.querySelectorAll('.node').forEach(node => {
        const show = event => {
          tipTitle.textContent = node.dataset.tipTitle;
          tipBody.textContent = node.dataset.tip;
          tip.classList.add('show');
          tip.setAttribute('aria-hidden', 'false');
          placeTip(event);
        };
        const hide = () => {
          tip.classList.remove('show');
          tip.setAttribute('aria-hidden', 'true');
        };
        node.addEventListener('pointerenter', show);
        node.addEventListener('pointermove', placeTip);
        node.addEventListener('pointerleave', hide);
        node.addEventListener('focus', event => {
          const box = node.getBoundingClientRect();
          show({ clientX: box.right, clientY: box.top });
        });
        node.addEventListener('blur', hide);
      });

      document.addEventListener('keydown', event => {
        const index = Number(event.key) - 1;
        if (index >= 0 && index < tabs.length) showView(tabs[index].dataset.view);
        if (event.key === 'Escape') tip.classList.remove('show');
      });
    })();
  </script>
